<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your InkSpace account.">
  <title>Log in | InkSpace</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="login">
  <noscript>
    <p class="form-message" style="text-align: center; margin: 15px auto; max-width: 600px;">JavaScript is required to use InkSpace.</p>
  </noscript>

  <div id="site-header"></div>

  <main class="auth-wrapper page-enter">
    <section class="auth-card" aria-labelledby="login-title">
      <p class="eyebrow">GOOD TO SEE YOU AGAIN</p>
      <h1 id="login-title">Welcome back.</h1>
      <p class="muted">Your next great idea is just a login away.</p>

      <div id="form-message" class="form-message" role="alert" hidden></div>

      <form id="login-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email"
          placeholder="you@example.com" required>

        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password"
            autocomplete="current-password" placeholder="Enter your password" required>
          <button id="toggle-password" class="password-action" type="button"
            aria-label="Show password" aria-pressed="false">Show</button>
        </div>

        <button class="btn btn-primary btn-full" type="submit">Log in</button>
      </form>

      <p class="auth-bottom">
        New around here? <a href="register.html">Create an account</a>
      </p>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
